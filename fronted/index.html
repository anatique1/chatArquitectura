<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatRoom</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171b2e;
      --panel-2: #1f2440;
      --border: #2a3055;
      --text: #eef0fb;
      --text-dim: #9aa1c4;
      --accent: #6c5ce7;
      --accent-2: #00d4b5;
      --danger: #ff5d7a;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top left, #1c2140, #0b0d18 70%);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- LOGIN ---------- */
    #login-screen {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 340px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      text-align: center;
    }

    #login-screen h1 {
      margin: 0 0 6px;
      font-size: 26px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    #login-screen p {
      margin: 0 0 24px;
      color: var(--text-dim);
      font-size: 13px;
    }

    .field {
      text-align: left;
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
    }

    #join-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--accent), #8a7bf0);
      color: white;
      font-weight: 600;
      font-size: 14px;
      margin-top: 8px;
      transition: transform 0.1s, opacity 0.15s;
    }

    #join-btn:hover { opacity: 0.9; }
    #join-btn:active { transform: scale(0.98); }

    #login-error {
      color: var(--danger);
      font-size: 12px;
      min-height: 16px;
      margin-top: 10px;
    }

    /* ---------- CHAT ---------- */
    #chat-screen {
      display: none;
      width: 900px;
      max-width: 96vw;
      height: 640px;
      max-height: 92vh;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    #chat-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100%;
    }

    /* sidebar */
    #sidebar {
      background: var(--panel-2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
    }

    #sidebar .room-name {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 2px;
      word-break: break-word;
    }

    #sidebar .room-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 18px;
    }

    #sidebar .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    #user-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex: 1;
    }

    #user-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      flex-shrink: 0;
      box-shadow: 0 0 6px var(--accent-2);
    }

    #leave-btn {
      margin-top: 12px;
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(255,93,122,0.4);
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s;
    }

    #leave-btn:hover { background: rgba(255,93,122,0.1); }

    /* main chat */
    #main-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    #chat-header .title {
      font-size: 14px;
      font-weight: 600;
    }

    #conn-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 72%;
    }

    .msg-row.own { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 3px;
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg-row.own .msg-bubble {
      background: linear-gradient(135deg, var(--accent), #8a7bf0);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg-row.other .msg-bubble {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .system-msg {
      align-self: center;
      font-size: 12px;
      color: var(--text-dim);
      font-style: italic;
      padding: 4px 0;
    }

    #typing-indicator {
      height: 18px;
      padding: 0 20px 4px;
      font-size: 12px;
      color: var(--accent-2);
      font-style: italic;
    }

    /* media bubbles */
    .msg-bubble img.msg-image {
      display: block;
      max-width: 220px;
      max-height: 260px;
      border-radius: 10px;
      cursor: pointer;
      object-fit: cover;
    }

    .msg-bubble audio.msg-audio {
      max-width: 230px;
      height: 36px;
    }

    .msg-caption {
      margin-top: 6px;
    }

    /* image lightbox */
    #image-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 15, 0.9);
      z-index: 50;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    #image-lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 10px;
    }

    #message-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      position: relative;
    }

    #message-input {
      flex: 1;
    }

    .toolbar-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .toolbar-btn:hover { border-color: var(--accent); }

    .toolbar-btn.recording {
      background: var(--danger);
      border-color: var(--danger);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    #recording-indicator {
      display: none;
      align-items: center;
      gap: 8px;
      flex: 1;
      font-size: 13px;
      color: var(--danger);
    }

    #recording-indicator .rec-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
      animation: pulse 1s infinite;
    }

    #emoji-panel {
      display: none;
      position: absolute;
      bottom: 62px;
      left: 20px;
      width: 280px;
      max-height: 220px;
      overflow-y: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    #emoji-panel button {
      background: transparent;
      font-size: 19px;
      padding: 4px;
      border-radius: 6px;
      line-height: 1;
    }

    #emoji-panel button:hover { background: var(--border); }

    #send-btn {
      background: linear-gradient(90deg, var(--accent-2), #00b39c);
      color: #04241f;
      font-weight: 700;
      padding: 0 20px;
      border-radius: 10px;
      font-size: 14px;
      height: 38px;
    }

    #send-btn:hover { opacity: 0.9; }

    @media (max-width: 640px) {
      #chat-layout { grid-template-columns: 1fr; }
      #sidebar { display: none; }
      #emoji-panel { left: 10px; width: 240px; grid-template-columns: repeat(6, 1fr); }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <h1>ChatRoom</h1>
    <p>Entra a una sala y empieza a conversar en tiempo real</p>
    <form id="login-form">
      <div class="field">
        <label for="username-input">Tu nombre</label>
        <input id="username-input" type="text" autocomplete="off" maxlength="20" placeholder="Ej. Felipe" required />
      </div>
      <div class="field">
        <label for="room-input">Sala</label>
        <input id="room-input" type="text" autocomplete="off" maxlength="30" placeholder="Ej. general" required />
      </div>
      <button id="join-btn" type="submit">Entrar al chat</button>
      <div id="login-error"></div>
    </form>
  </div>

  <!-- CHAT -->
  <div id="chat-screen">
    <div id="chat-layout">
      <aside id="sidebar">
        <div class="room-name" id="sidebar-room-name">#sala</div>
        <div class="room-sub" id="sidebar-username-sub">conectado como ...</div>
        <div class="section-title">En línea</div>
        <ul id="user-list"></ul>
        <button id="leave-btn" type="button">Salir de la sala</button>
      </aside>

      <div id="main-panel">
        <div id="chat-header">
          <div class="title" id="header-room-title">#sala</div>
          <div id="conn-status">
            <span class="status-dot" id="conn-dot"></span>
            <span id="conn-text">conectando...</span>
          </div>
        </div>

        <div id="messages"></div>
        <div id="typing-indicator"></div>

        <form id="message-form">
          <div id="emoji-panel"></div>

          <button class="toolbar-btn" id="emoji-btn" type="button" title="Emojis">😊</button>
          <button class="toolbar-btn" id="photo-btn" type="button" title="Enviar foto">📷</button>
          <button class="toolbar-btn" id="mic-btn" type="button" title="Grabar audio">🎤</button>
          <input id="photo-input" type="file" accept="image/*" hidden />

          <input id="message-input" type="text" autocomplete="off" placeholder="Escribe un mensaje..." />

          <div id="recording-indicator">
            <span class="rec-dot"></span>
            <span id="recording-time">0:00</span>
            <span>grabando...</span>
          </div>

          <button id="send-btn" type="submit">Enviar</button>
        </form>
      </div>
    </div>
  </div>

  <div id="image-lightbox">
    <img id="lightbox-img" src="" alt="imagen ampliada" />
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username-input');
    const roomInput = document.getElementById('room-input');
    const loginError = document.getElementById('login-error');

    const sidebarRoomName = document.getElementById('sidebar-room-name');
    const sidebarUsernameSub = document.getElementById('sidebar-username-sub');
    const headerRoomTitle = document.getElementById('header-room-title');
    const userList = document.getElementById('user-list');
    const leaveBtn = document.getElementById('leave-btn');

    const connDot = document.getElementById('conn-dot');
    const connText = document.getElementById('conn-text');

    const messagesEl = document.getElementById('messages');
    const typingIndicator = document.getElementById('typing-indicator');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');

    const emojiBtn = document.getElementById('emoji-btn');
    const emojiPanel = document.getElementById('emoji-panel');
    const photoBtn = document.getElementById('photo-btn');
    const photoInput = document.getElementById('photo-input');
    const micBtn = document.getElementById('mic-btn');
    const recordingIndicator = document.getElementById('recording-indicator');
    const recordingTime = document.getElementById('recording-time');
    const imageLightbox = document.getElementById('image-lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    let socket = null;
    let username = '';
    let room = '';
    let typingTimeout = null;

    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingStartTime = 0;
    let recordingTimerId = null;

    const EMOJIS = [
      '😀','😁','😂','🤣','😊','😍','😘','😜','🤔','😎',
      '😢','😭','😡','🥳','😴','🤯','😱','🤗','🙄','😇',
      '👍','👎','👏','🙌','🙏','💪','👋','🤝','✌️','🤞',
      '❤️','💔','💯','🔥','✨','🎉','🎂','⭐','☀️','🌙',
      '🐶','🐱','🍕','🍔','🍺','☕','⚽','🎮','📚','💻'
    ];

    function buildEmojiPanel() {
      emojiPanel.innerHTML = '';
      EMOJIS.forEach((emoji) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = emoji;
        btn.addEventListener('click', () => {
          messageInput.value += emoji;
          messageInput.focus();
        });
        emojiPanel.appendChild(btn);
      });
    }
    buildEmojiPanel();

    emojiBtn.addEventListener('click', () => {
      emojiPanel.style.display = emojiPanel.style.display === 'grid' ? 'none' : 'grid';
    });

    document.addEventListener('click', (e) => {
      if (!emojiPanel.contains(e.target) && e.target !== emojiBtn) {
        emojiPanel.style.display = 'none';
      }
    });

    imageLightbox.addEventListener('click', () => {
      imageLightbox.style.display = 'none';
      lightboxImg.src = '';
    });

    function resizeImageToDataUrl(file, maxWidth = 900, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    photoBtn.addEventListener('click', () => photoInput.click());

    photoInput.addEventListener('change', async () => {
      const file = photoInput.files[0];
      photoInput.value = '';
      if (!file || !socket) return;

      try {
        const dataUrl = await resizeImageToDataUrl(file);
        socket.emit('message', {
          room,
          username,
          type: 'image',
          mediaData: dataUrl,
          message: messageInput.value.trim(),
        });
        messageInput.value = '';
      } catch (err) {
        console.error('No se pudo procesar la imagen', err);
      }
    });

    async function toggleRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          clearInterval(recordingTimerId);
          recordingIndicator.style.display = 'none';
          micBtn.classList.remove('recording');

          const blob = new Blob(recordedChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = () => {
            if (!socket) return;
            socket.emit('message', {
              room,
              username,
              type: 'audio',
              mediaData: reader.result,
              message: '',
            });
          };
          reader.readAsDataURL(blob);
        };

        mediaRecorder.start();
        micBtn.classList.add('recording');
        recordingIndicator.style.display = 'flex';
        recordingStartTime = Date.now();
        recordingTimerId = setInterval(() => {
          const secs = Math.floor((Date.now() - recordingStartTime) / 1000);
          const m = Math.floor(secs / 60);
          const s = String(secs % 60).padStart(2, '0');
          recordingTime.textContent = `${m}:${s}`;
          if (secs >= 60) mediaRecorder.stop(); // límite de 60s
        }, 250);
      } catch (err) {
        console.error('No se pudo acceder al micrófono', err);
        alert('No se pudo acceder al micrófono. Revisa los permisos del navegador.');
      }
    }

    micBtn.addEventListener('click', toggleRecording);

    // recordar nombre/sala anteriores
    usernameInput.value = localStorage.getItem('chat-username') || '';
    roomInput.value = localStorage.getItem('chat-room') || '';

    function hashColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue}, 65%, 55%)`;
    }

    function formatTime(dateInput) {
      const d = new Date(dateInput);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderMessage(doc) {
      const isOwn = doc.username === username;
      const row = document.createElement('div');
      row.className = `msg-row ${isOwn ? 'own' : 'other'}`;

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.style.color = isOwn ? 'var(--text-dim)' : hashColor(doc.username);
      meta.textContent = `${isOwn ? 'Tú' : doc.username} · ${formatTime(doc.createdAt)}`;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      if (doc.type === 'image' && doc.mediaData) {
        const img = document.createElement('img');
        img.className = 'msg-image';
        img.src = doc.mediaData;
        img.addEventListener('click', () => {
          lightboxImg.src = doc.mediaData;
          imageLightbox.style.display = 'flex';
        });
        bubble.appendChild(img);

        if (doc.message) {
          const caption = document.createElement('div');
          caption.className = 'msg-caption';
          caption.textContent = doc.message;
          bubble.appendChild(caption);
        }
      } else if (doc.type === 'audio' && doc.mediaData) {
        const audio = document.createElement('audio');
        audio.className = 'msg-audio';
        audio.src = doc.mediaData;
        audio.controls = true;
        bubble.appendChild(audio);
      } else {
        bubble.textContent = doc.message;
      }

      row.appendChild(meta);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function renderSystemMessage(text) {
      const el = document.createElement('div');
      el.className = 'system-msg';
      el.textContent = text;
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    function renderUserList(users) {
      userList.innerHTML = '';
      users.forEach((u) => {
        const li = document.createElement('li');
        const dot = document.createElement('span');
        dot.className = 'status-dot';
        const name = document.createElement('span');
        name.textContent = u;
        li.appendChild(dot);
        li.appendChild(name);
        userList.appendChild(li);
      });
    }

    function setConnectionStatus(connected) {
      connDot.style.background = connected ? 'var(--accent-2)' : 'var(--danger)';
      connDot.style.boxShadow = connected ? '0 0 6px var(--accent-2)' : '0 0 6px var(--danger)';
      connText.textContent = connected ? 'conectado' : 'desconectado';
    }

    function joinChat(name, roomName) {
      username = name.trim();
      room = roomName.trim();

      localStorage.setItem('chat-username', username);
      localStorage.setItem('chat-room', room);

      sidebarRoomName.textContent = `#${room}`;
      headerRoomTitle.textContent = `#${room}`;
      sidebarUsernameSub.textContent = `conectado como ${username}`;

      loginScreen.style.display = 'none';
      chatScreen.style.display = 'block';
      messagesEl.innerHTML = '';

      socket = io();

      socket.on('connect', () => {
        setConnectionStatus(true);
        socket.emit('join-room', { room, username });
      });

      socket.on('disconnect', () => setConnectionStatus(false));

      socket.on('room-history', (history) => {
        messagesEl.innerHTML = '';
        history.forEach(renderMessage);
      });

      socket.on('messages', renderMessage);
      socket.on('system-message', renderSystemMessage);
      socket.on('online-users', renderUserList);

      socket.on('typing', (who) => {
        typingIndicator.textContent = `${who} está escribiendo...`;
      });

      socket.on('stop-typing', () => {
        typingIndicator.textContent = '';
      });

      messageInput.focus();
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = usernameInput.value.trim();
      const roomName = roomInput.value.trim();

      if (!name || !roomName) {
        loginError.textContent = 'Completa tu nombre y la sala.';
        return;
      }
      loginError.textContent = '';
      joinChat(name, roomName);
    });

    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !socket) return;

      socket.emit('message', { room, username, type: 'text', message: text });
      socket.emit('stop-typing', { room });
      messageInput.value = '';
      clearTimeout(typingTimeout);
    });

    messageInput.addEventListener('input', () => {
      if (!socket) return;
      socket.emit('typing', { room, username });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('stop-typing', { room });
      }, 1200);
    });

    leaveBtn.addEventListener('click', () => {
      if (socket) socket.disconnect();
      chatScreen.style.display = 'none';
      loginScreen.style.display = 'block';
      typingIndicator.textContent = '';
      userList.innerHTML = '';
    });
  </script>
</body>

</html>
